[package]
name = "kapplier"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.98"
axum = "0.8.4"
clap = { version = "4.5.42", features = ["derive", "env"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = "4.0.0"
prometheus = { version = "0.14.0", features = ["process"] }
serde = "1.0.219"
serde_yaml = "0.9.33"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2.5.0"

[profile.release]
strip = true
